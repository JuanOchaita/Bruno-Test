info:
  name: health
  type: http
  seq: 2

http:
  method: GET
  url: http://127.0.0.1:8000/health
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("200",() =>{
          expect(res.status).to.equal(200);
        });

        test("Status",() =>{
          expect(res.statusText).to.equal("OK");
          expect(res.body.status).to.equal("ok");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
