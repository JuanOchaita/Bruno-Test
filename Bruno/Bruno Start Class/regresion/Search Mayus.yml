info:
  name: Search Mayus
  type: http
  seq: 2

http:
  method: GET
  url: 127.0.0.1:8000/books?author=CHRISTIE WILSON
  params:
    - name: author
      value: CHRISTIE WILSON
      type: query
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // Partición de equivalencia

        test("200",() =>{
          expect(res.status).to.equal(200);
        });

        test("OK",() =>{
          expect(res.statusText).to.equal("OK");
        });

        test("Book info",() =>{
          expect(res.body[0].author).to.equal("Christie Wilson");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
